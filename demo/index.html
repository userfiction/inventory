<!doctype html>
<!-- ============================================================================
     demo/index.html — single-page shell for the @userfiction/inventory demo
     Vanilla HTML/CSS/TS only: no framework, no backend, no fetch. The UI is
     ONE PRESENTATION of the inventory JSON: items render as draggable icons
     (hover/focus for per-unit details, drag & drop between inventories to
     exchange), and the JSON views sit directly under each inventory.

     main.ts injects the version into the title from ../package.json, so the
     shell only carries the static skeleton below. To add a THIRD inventory:
     copy a <section class="panel"> with a unique id/data-owner and add one
     matching entry to the `owners` array in main.ts — everything else
     (rendering, drag & drop, JSON) is data-driven per owner.
============================================================================ -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Userfiction Inventory</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <header class="top">
            <!-- main.ts appends " vX.X.X" (package.json version) to this title -->
            <h1 id="demo-title">Userfiction Inventory</h1>
        </header>

        <main class="layout">
            <!-- One panel per inventory: icon grid first (items as draggable
                 icons with hover/focus detail tooltips), the derived JSON
                 views under it. Each panel IS a drop target for drag & drop
                 exchanges between inventories. -->
            <section class="panel" id="hero-panel" aria-label="Hero inventory">
                <h2>Hero</h2>
                <div id="hero-bag"></div>
                <div id="hero-json"></div>
            </section>

            <section class="panel" id="merchant-panel" aria-label="Merchant inventory">
                <h2>Merchant</h2>
                <div id="merchant-bag"></div>
                <div id="merchant-json"></div>
            </section>
        </main>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
